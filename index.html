<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0d" />
    <title>A Masmorra de Anakk Tur - Mobile V113</title>
    <meta name="description" content="A Masmorra de Anakk Tur — versão mobile web." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/index-v113.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-dfopopt3.css">
    <link rel="stylesheet" href="/anakk-mobile.css">
  </head>
  <body class="bg-[#0c0c0d] text-gray-100 antialiased select-none font-sans overflow-x-hidden">
    <div id="root"></div>
  
<script>
(function(){
  function markOpening(){
    var v=document.querySelector('.anakk-opening-video');
    if(!v) return;
    var p=v.parentElement;
    if(!p) return;
    p.classList.add('anakk-opening-clean');
    var overlays=p.querySelectorAll(':scope > .absolute.inset-0.bg-black\/70');
    overlays.forEach(function(el){el.classList.add('opening-dark-overlay');});
  }
  markOpening();
  new MutationObserver(markOpening).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
</body>
</html>
